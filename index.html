<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#03030a" />
  <title>Aether — hold a galaxy in your hands</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>

  <section id="intro">
    <p class="eyebrow">A WebGPU experiment</p>
    <h1 id="title">Aether</h1>
    <p class="lede">A universe of galaxies, and your hands.</p>
    <div class="cta">
      <button id="btnCam" class="primary">Use my hands</button>
      <button id="btnMouse">Use the mouse</button>
    </div>
    <p class="fine">Hand tracking runs on your device. The camera image never leaves this page.</p>
  </section>

  <div id="hud" hidden>
    <ul id="guide"></ul>
    <div id="tools"><button id="btnCreate" title="Create stars, planets, black holes (C)">✦ Create</button><button id="btnUniverse" title="Zoom out to the universe (Esc)">Universe</button><button id="btnFeed" title="Show or hide yourself (V)">You</button><button id="btnRec" title="Record a 9:16 clip (R)">● Record</button></div>
    <div id="tools2" hidden>
      <button data-tool="star" class="on">✦ Star</button><button data-tool="planet">● Planet</button><button data-tool="hole">◉ Black hole</button><button data-tool="nebula">☁ Nebula</button><button data-tool="nova">✺ Supernova</button><button id="btnClear">Clear</button>
    </div>
    <div id="label" hidden></div>
    <div id="toast"></div>
    <div id="exitRing"></div>
    <div id="status"></div>
  </div>
  <video id="video" playsinline muted hidden></video>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
